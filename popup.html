<!doctype html>
<html lang="ko" class="preload">
<meta charset="utf-8">
<title>Cosmate</title>
<style>
  /* 색·모서리·글꼴은 LMS 테마(lms.inu.ac.kr의 --csms-* 값)를 따름. 스위치·알약 버튼은
     Bootstrap의 클래스 이름과 모양만 빌리고 Bootstrap 자체는 넣지 않음. */
  :root {
    --brand: #1181f9; --brand-hover: #0e6fd9; --brand-soft: #e0eefe; --brand-line: #c9e0fc; --brand-focus: rgba(17, 129, 249, .25);
    --text: #161819; --text-2: #2c2f32; --gray: #899199;
    --line: #e0e3e5; --line-soft: #eef0f2; --track: #d3d6d9; --bg: #f6f7f8;
    --danger: #c62828; --danger-soft: #fdecec;
  }
  * { box-sizing: border-box; }
  /* 팝업을 열 때 저장값을 채우는 동안은 전환 효과를 끔(popup.js가 다 채운 뒤 .preload를 뗌). */
  .preload *, .preload *::after { transition: none !important; }
  body { width: 280px; margin: 0; padding: 10px 14px 10px; background: var(--bg); color: var(--text-2);
         font: 13px/1.45 "Pretendard Variable", Pretendard, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", Helvetica, sans-serif; }

  /* 제목 줄: 로고·이름. 새로고침 안내(#stale)가 덮어도 선명하게 그 위에 둠. 설정할 수 없는 페이지면 아래 줄에 안내. */
  header { position: relative; z-index: 2; display: flex; align-items: center; gap: 10px; margin: 0 2px; }
  header > img { width: 28px; height: 28px; border-radius: 8px; }
  /* 제목은 Degular Bold를 윤곽선으로 바꾼 wordmark.svg(Adobe Fonts 글꼴 파일은 확장에 넣을 수 없음). */
  h1 { flex: 1; margin: 0; line-height: 0; }
  h1 img { height: 15px; }
  #notice { margin: 4px 4px 0; font-size: 12px; color: var(--gray); }
  #notice:empty { display: none; }
  /* 이 사이트 행: 주소는 한 줄로 두고 넘치면 말줄임. */
  #site-host { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* LMS 화면별 묶음. 과제·퀴즈 화면의 "시험 정보" 상자처럼 작은 제목 아래 흰 상자로 둠. */
  h2 { margin: 10px 4px 4px; font-size: 12px; font-weight: 600; line-height: 16px; color: var(--gray); }
  .box { overflow: hidden; background: #fff; border: 1px solid var(--line); border-radius: 12px; }
  /* 이 사이트가 꺼져 있으면 코스모스 기능이 돌지 않으므로 비활성처럼 보이게 함(popup.js가 inert를 붙임). */
  .needs-site { transition: opacity .15s, filter .15s; }
  .needs-site[inert] { opacity: .45; filter: grayscale(1); }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 30px; padding: 5px 12px; }
  label.row { cursor: pointer; transition: background .12s; }
  label.row:hover { background: #f8fbff; }
  .row + .row, .row + .warn { border-top: 1px solid var(--line-soft); }
  .row > span { min-width: 0; font-weight: 500; }
  .row small { display: block; font-size: 11.5px; font-weight: 400; color: var(--gray); }

  /* Bootstrap 모양 스위치 */
  .form-switch .form-check-input { position: relative; flex: none; width: 34px; height: 20px; margin: 0; appearance: none;
         border-radius: 999px; background: var(--track); cursor: pointer; transition: background .15s; }
  .form-switch .form-check-input::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px;
         border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0, 0, 0, .25); transition: transform .15s; }
  .form-switch .form-check-input:checked { background: var(--brand); }
  .form-switch .form-check-input:checked::after { transform: translateX(14px); }
  .form-switch .form-check-input:focus-visible { outline: 0; box-shadow: 0 0 0 3px var(--brand-focus); }
  .form-switch .form-check-input:disabled { opacity: .5; cursor: not-allowed; }

  /* 한 행에 옵션 여러 개를 두는 칩(체크박스). 켜지면 파란 바탕에 체크 표시. 팝업 폭을 좁게 두려고
     칩은 행 이름 아래 줄에 두고, 글꼴이 넓어 폭이 모자라면(Windows 등) 다음 줄로 넘어감. */
  .row:has(.chips) { flex-direction: column; align-items: flex-start; gap: 4px; }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; }
  .chip { position: relative; display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px; border: 1px solid var(--line);
          border-radius: 999px; background: #fff; font-size: 12px; font-weight: 500; color: var(--gray); white-space: nowrap; cursor: pointer;
          transition: background .12s, color .12s, border-color .12s; }
  .chip input { position: absolute; opacity: 0; pointer-events: none; }
  .chip:has(input:checked) { background: var(--brand-soft); border-color: var(--brand-line); color: var(--brand); }
  .chip:has(input:checked)::before { content: ""; width: 7px; height: 4px; margin-top: -2px; border: solid currentColor;
          border-width: 0 0 1.5px 1.5px; transform: rotate(-45deg); }
  .chip:has(input:focus-visible) { box-shadow: 0 0 0 3px var(--brand-focus); }

  .warn { display: none; margin: 0; padding: 7px 12px; background: var(--danger-soft); color: var(--danger); font-size: 12px; font-weight: 500; }
  .row:has([name=rightClick]:checked) + .warn { display: block; }

  /* 파란 알약 버튼(하단 바·새로고침 안내) */
  button { padding: 8px 14px; border: 0; border-radius: 80px; background: var(--brand); color: #fff;
           font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer; transition: background .15s; }
  button:hover { background: var(--brand-hover); }
  button:focus-visible { outline: 0; box-shadow: 0 0 0 3px var(--brand-focus); }

  /* 하단 고정 버튼: 새로고침이 필요한 옵션을 바꿨을 때만 보임. */
  #apply { position: sticky; bottom: 0; margin: 10px -14px -10px; padding: 6px 14px 8px; background: var(--bg); border-top: 1px solid var(--line); }
  #apply[hidden] { display: none; }
  #apply button { width: 100%; }

  /* 확장 업데이트 전에 열린 탭: 설정을 흐리게 가리고 가운데에 안내와 새로고침 버튼을 둠. */
  #stale { position: fixed; inset: 0; z-index: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
           gap: 12px; padding: 0 28px; background: color-mix(in srgb, var(--bg) 40%, transparent); backdrop-filter: blur(4px); text-align: center; }
  #stale[hidden] { display: none; }
  #stale p { margin: 0; font-size: 14px; font-weight: 600; color: var(--text); }
  #stale small { display: block; margin-top: 2px; font-size: 12px; font-weight: 400; color: var(--gray); }
  #stale button { padding-inline: 22px; }
</style>

<header>
  <img src="cosmos-lxp-logo.png" alt="">
  <h1><img src="wordmark.svg" alt="Cosmate"></h1>
</header>
<p id="notice"></p>

<section id="site" hidden>
  <h2>이 사이트에서 사용</h2>
  <div class="box">
    <label class="row form-switch"><span><span id="site-host"></span><small id="site-status"></small></span><input class="form-check-input" type="checkbox" role="switch" id="site-toggle"></label>
  </div>
</section>

<section class="needs-site">
  <h2>홈</h2>
  <div class="box">
    <label class="row form-switch"><span>목록형 보기 얇게</span><input class="form-check-input" type="checkbox" role="switch" name="compactList"></label>
    <label class="row form-switch"><span>이번 주 할 일의 과목명을 링크로</span><input class="form-check-input" type="checkbox" role="switch" name="courseLink"></label>
  </div>
</section>

<section class="needs-site">
  <h2>과목</h2>
  <div class="box">
    <div class="row"><span>과목 화면 버튼</span><div class="chips">
      <label class="chip" title="파일 옆 다운로드 버튼과 주차별 모두 받기 버튼"><input type="checkbox" name="fileButton">다운로드</label>
      <label class="chip" title="과제·퀴즈의 구글 캘린더 추가와 .ics 저장"><input type="checkbox" name="calendarLinks">캘린더</label>
      <label class="chip" title="퀴즈 답안검토 화면의 인쇄 버튼"><input type="checkbox" name="quizPrint">인쇄</label>
    </div></div>
    <label class="row form-switch"><span>파일을 미리보기로 열기<small>Ctrl/⌘+클릭은 다운로드</small></span><input class="form-check-input" type="checkbox" role="switch" name="previewFiles"></label>
  </div>
</section>

<section class="needs-site">
  <h2>강의 영상</h2>
  <div class="box">
    <div class="row"><span>플레이어 버튼</span><div class="chips">
      <label class="chip" title="강의 영상(MP4·MP3)과 지금 장면(PNG) 저장"><input type="checkbox" name="vodDownload">다운로드</label>
      <label class="chip" title="다 들은 강의는 최대 4배속까지"><input type="checkbox" name="speedPanel">4배속</label>
      <label class="chip" title="작은 창(PiP)으로 보기"><input type="checkbox" name="pipButton">PiP</label>
    </div></div>
    <div class="row"><span>강의가 끝나면</span><div class="chips">
      <label class="chip" title="배지와 소리로 알림"><input type="checkbox" name="endNotify">알림</label>
      <label class="chip" title="다음 영상으로 자동 이동"><input type="checkbox" name="autoNext">다음 영상</label>
    </div></div>
  </div>
</section>

<section>
  <h2>모든 화면</h2>
  <div class="box">
    <label class="row form-switch"><span>우클릭·복사 차단 해제</span><input class="form-check-input" type="checkbox" role="switch" name="rightClick"></label>
    <p class="warn">시험·퀴즈 중에는 사용하면 안 됩니다.</p>
  </div>
</section>

<div id="apply" hidden><button type="button">새로고침하여 변경사항 적용</button></div>
<div id="stale" hidden>
  <p>확장 업데이트 전에 열린 탭이에요<small>새로고침하면 Cosmate가 다시 연결돼요.</small></p>
  <button type="button">이 페이지 새로고침</button>
</div>
<script src="js/popup.js"></script>
